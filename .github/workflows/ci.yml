# 검사·테스트·빌드·E2E·컨테이너(ARM64 포함) 확인. 비밀값을 쓰지 않고, 실제 X·AI·R2를 호출하지 않는다 (목업·가짜 서버).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://xauto:xauto@127.0.0.1:5432/postgres?sslmode=disable

jobs:
  check:
    name: lint · test · build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xauto
          POSTGRES_PASSWORD: xauto
          POSTGRES_DB: xauto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xauto -d xauto"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make lint
      - run: make test
      - run: make build

  e2e:
    name: e2e (mock)
    needs: check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xauto
          POSTGRES_PASSWORD: xauto
          POSTGRES_DB: xauto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xauto -d xauto"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  container:
    name: container (arm64 + amd64)
    needs: check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xauto
          POSTGRES_PASSWORD: xauto
          POSTGRES_DB: xauto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xauto -d xauto"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      # 두 아키텍처를 빌드만 한다 (배포는 KoDeploy가 직접 빌드)
      - run: docker buildx build --platform linux/arm64,linux/amd64 --build-arg VERSION=${GITHUB_SHA::7} .
      # amd64 이미지를 실제로 띄워 마이그레이션·준비 상태·로그인·정상 종료를 확인한다
      - name: smoke test
        run: |
          docker buildx build --platform linux/amd64 --load -t xa:ci .
          HASH=$(printf 'ci-smoke-password\n' | docker run --rm -i --entrypoint /app/admin xa:ci hash-password)
          KEY=$(docker run --rm --entrypoint /app/admin xa:ci gen-key 2>/dev/null)
          docker run -d --name xa --network host -e PORT=8080 -e APP_BASE_URL=https://xa.example.test \
            -e DATABASE_URL="postgres://xauto:xauto@127.0.0.1:5432/xauto?sslmode=disable" \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD_HASH="$HASH" -e TOKEN_ENCRYPTION_KEY="$KEY" xa:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/home)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Origin: https://xa.example.test' \
            -d '{"username":"admin","password":"ci-smoke-password"}' localhost:8080/api/auth/login)" = 200
          docker stop -t 30 xa
          test "$(docker inspect xa --format '{{.State.ExitCode}}')" = 0
